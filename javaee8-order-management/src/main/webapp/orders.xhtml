<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Orders</title>
</h:head>
<h:body>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="SKU:" for="sku"/>
            <h:inputText id="sku" value="#{orderBackingBean.currentOrder.status}"/>
        </h:panelGrid>
        <h:commandButton value="Submit Order" action="#{orderBackingBean.submitOrder}"/>
    </h:form>
</h:body>
</html>
